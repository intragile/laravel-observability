name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
env:
  # Runs the broadcast round trip against a real Reverb server started by the test.
  OBSERVABILITY_REVERB_TEST: "1"
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '12.*' }
          - { php: '8.4', laravel: '12.*' }
          - { php: '8.5', laravel: '12.*' }
          - { php: '8.3', laravel: '13.*' }
          - { php: '8.4', laravel: '13.*' }
          - { php: '8.5', laravel: '13.*' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, posix, pcntl, sockets
          coverage: none
      # No spatie/laravel-prometheus release supports both PHP 8.3 and Laravel 13, so that job runs
      # without it (the Prometheus tests skip) and leaves static analysis to the other jobs.
      - if: matrix.php == '8.3' && matrix.laravel == '13.*'
        run: composer remove --dev spatie/laravel-prometheus --no-update --no-interaction
      - run: composer require --dev "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - if: ${{ !(matrix.php == '8.3' && matrix.laravel == '13.*') }}
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test

  minimal:
    # Only the required dependencies: proves the package boots and its tests pass (or skip) when no
    # optional package is installed. No phpstan here, because the optional classes are missing.
    runs-on: ubuntu-latest
    name: PHP 8.3 / Laravel 12.* / no optional packages
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, posix
          coverage: none
      - run: composer remove --dev spatie/laravel-prometheus spatie/laravel-backup laravel/reverb phrity/websocket laravel/doctor --no-update --no-interaction
      - run: composer require --dev "illuminate/support:12.*" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
